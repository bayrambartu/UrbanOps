name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (vet, build, race tests with PostgreSQL and RabbitMQ)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: urbanops_test
          POSTGRES_USER: urbanops
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urbanops -d urbanops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: urbanops
          RABBITMQ_DEFAULT_PASS: ci_test_only
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://urbanops:ci_test_only@127.0.0.1:5432/urbanops_test?sslmode=disable
      TEST_RABBITMQ_URL: amqp://urbanops:ci_test_only@127.0.0.1:5672/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test with race detection (integration tests run against real services)
        run: |
          go test -race -count=1 -v ./... 2>&1 | tee test.log
          # A skipped integration test would silently hide a broken pipeline.
          ! grep -q -- "--- SKIP" test.log

  frontend:
    name: Frontend (type check and production build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: web
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t urbanops:ci .
