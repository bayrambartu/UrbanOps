name: urbanops
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: urbanops
      POSTGRES_USER: urbanops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:5435:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanops -d urbanops"]
      interval: 5s
      timeout: 3s
      retries: 15
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: urbanops
      RABBITMQ_DEFAULT_PASS: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    restart: unless-stopped
    build: .
    environment: &app-env
      DATABASE_URL: postgres://urbanops:${POSTGRES_PASSWORD}@postgres:5432/urbanops?sslmode=disable
      RABBITMQ_URL: amqp://urbanops:${POSTGRES_PASSWORD}@rabbitmq:5672/
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      INGEST_TOKEN: ${INGEST_TOKEN:?Set INGEST_TOKEN}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@urbanops.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      IMPORT_TRAINING_DOCS: ${IMPORT_TRAINING_DOCS:-false}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:7b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    restart: unless-stopped
    build: .
    command: ["/app/worker"]
    environment: *app-env
    depends_on:
      api: {condition: service_healthy}
  simulator:
    build: .
    command: ["/app/simulator"]
    profiles: ["simulation"]
    environment:
      API_URL: http://api:8080
      INGEST_TOKEN: ${INGEST_TOKEN}
      SIM_INTERVAL: 10s
    depends_on:
      api: {condition: service_healthy}
  ollama:
    image: ollama/ollama:0.6.8
    profiles: ["ai"]
    volumes: ["ollama-data:/root/.ollama"]
  test-postgres:
    image: pgvector/pgvector:pg16
    profiles: ["test"]
    environment:
      POSTGRES_DB: urbanops_test
      POSTGRES_USER: urbanops
      POSTGRES_PASSWORD: isolated-test-password
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanops -d urbanops_test"]
      interval: 3s
      timeout: 3s
      retries: 20
  test-rabbitmq:
    image: rabbitmq:4-management
    profiles: ["test"]
    environment:
      RABBITMQ_DEFAULT_USER: urbanops
      RABBITMQ_DEFAULT_PASS: isolated-test-password
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30
  integration:
    build:
      context: .
      target: backend
    profiles: ["test"]
    command: ["go", "test", "-v", "-count=1", "./..."]
    environment:
      TEST_DATABASE_URL: postgres://urbanops:isolated-test-password@test-postgres:5432/urbanops_test?sslmode=disable
      TEST_RABBITMQ_URL: amqp://urbanops:isolated-test-password@test-rabbitmq:5672/
    depends_on:
      test-postgres: {condition: service_healthy}
      test-rabbitmq: {condition: service_healthy}
volumes:
  postgres-data:
  rabbitmq-data:
  ollama-data:
